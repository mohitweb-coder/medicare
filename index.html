
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MediCare | Admin Login</title>
    <link rel="stylesheet" href="auth.css">
</head>
<body>

    <div class="login-container">

        <div class="brand">
            <div class="brand-icon">✚</div>
            <h1>Medi<span>Care</span></h1>
            <p>Hospital Management System</p>
        </div>

        <!-- Login Section -->
        <div id="login-section" class="form-section">

            <h2>Welcome Back!</h2>
            <p class="subtitle">Login to your admin account</p>

            <form id="login-form">

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="login-email"
                        placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="login-password"
                            placeholder="Enter password" required>
                        <button type="button" class="toggle-password"
                            data-target="login-password">Show</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Login to Dashboard →
                </button>

            </form>

            <p class="switch-text">
                Don't have an account?
                <a href="#" id="show-register">Create Account</a>
            </p>

            <div id="login-message" class="message"></div>
        </div>

        <!-- Registration Section -->
        <div id="register-section" class="form-section hidden">

            <h2>Create Account</h2>
            <p class="subtitle">Register as a hospital administrator</p>

            <form id="register-form">

                <div class="input-group">
                    <label>Full Name</label>
                    <input type="text" id="register-name"
                        placeholder="Enter your name" required>
                </div>

                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" id="register-email"
                        placeholder="Enter your email" required>
                </div>

                <div class="input-group">
                    <label>Password</label>
                    <div class="password-box">
                        <input type="password" id="register-password"
                            placeholder="Create password" minlength="6" required>
                        <button type="button" class="toggle-password"
                            data-target="register-password">Show</button>
                    </div>
                </div>

                <div class="input-group">
                    <label>Confirm Password</label>
                    <div class="password-box">
                        <input type="password" id="confirm-password"
                            placeholder="Confirm password" required>
                        <button type="button" class="toggle-password"
                            data-target="confirm-password">Show</button>
                    </div>
                </div>

                <button type="submit" class="submit-btn">
                    Create Account →
                </button>

            </form>

            <p class="switch-text">
                Already have an account?
                <a href="#" id="show-login">Login Here</a>
            </p>

            <div id="register-message" class="message"></div>
        </div>

        <div class="footer">
            © 2026 MediCare Hospital. All Rights Reserved.
        </div>

    </div>

    <script src="auth.js"></script>
</body>
</html>
